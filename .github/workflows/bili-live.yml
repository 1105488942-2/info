name: B站开播通知

'on':
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'poll 或 test'
        required: false
        default: 'poll'

permissions:
  contents: read
  gist: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 下载 state.json
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 gist_helper.py download
      - name: 下载 state.json 完成
        run: echo "done"
      - name: 跑轮询或测试
        env:
          QQ_APPID: ${{ secrets.QQ_APPID }}
          QQ_SECRET: ${{ secrets.QQ_SECRET }}
          QQ_OFFICIAL_ENABLED: 'true'
          MODE: ${{ github.event.inputs.mode }}
        run: |
          python3 -c "import os; print('MODE=' + os.environ.get('MODE',''))"
          if [ "$MODE" = "test" ]; then
            python3 main.py --test --test-group 668286732 --no-web
          else
            python3 main.py --once --no-web
          fi
      - name: 上传 state.json
        if: always()
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 gist_helper.py upload
