name: B站开播通知

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 运行模式 (poll=轮询, test=发测试消息)
        required: false
        default: poll

permissions:
  contents: read
  gist: write

jobs:
  poll:
    runs-on: ubuntu-latest
    # 正常轮询：schedule 触发，或手动选 poll
    if: github.event_name == 'schedule' || github.event.inputs.mode == 'poll' || github.event.inputs.mode == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: 下载 state.json
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 gist_helper.py download

      - name: 跑轮询
        env:
          QQ_APPID: ${{ secrets.QQ_APPID }}
          QQ_SECRET: ${{ secrets.QQ_SECRET }}
          QQ_OFFICIAL_ENABLED: "true"
        run: python3 main.py --once --no-web

      - name: 上传 state.json
        if: always()
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 gist_helper.py upload

  test:
    runs-on: ubuntu-latest
    # 测试：手动选 test
    if: github.event.inputs.mode == 'test'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: 发测试消息
        env:
          QQ_APPID: ${{ secrets.QQ_APPID }}
          QQ_SECRET: ${{ secrets.QQ_SECRET }}
          QQ_OFFICIAL_ENABLED: "true"
        run: python3 main.py --test --no-web
