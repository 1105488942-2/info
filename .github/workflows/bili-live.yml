name: B站开播通知

on:
  schedule:
    # 每 5 分钟跑一次（GitHub Actions 最短间隔 5 分钟）
    - cron: '*/5 * * * *'
  workflow_dispatch:  # 允许手动点按钮触发

permissions:
  contents: read
  gist: write  # 必须显式申请 gist 权限才能读写 state.json

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装依赖
        run: pip install -r requirements.txt

      - name: 下载 state.json
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 gist_helper.py download

      - name: 跑一轮轮询
        env:
          QQ_APPID: ${{ secrets.QQ_APPID }}
          QQ_SECRET: ${{ secrets.QQ_SECRET }}
          QQ_OFFICIAL_ENABLED: "true"
        run: python3 main.py --once --no-web

      - name: 上传 state.json
        if: always()
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 gist_helper.py upload
