name: BiliNotify

on: [push, workflow_dispatch]

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python3 gist_helper.py download
      - run: python3 main.py --once --no-web
      - run: python3 gist_helper.py upload
