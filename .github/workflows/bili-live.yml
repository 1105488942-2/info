name: B站开播通知

on:
  schedule:
    # 每 5 分钟跑一次（GitHub Actions 最短间隔 5 分钟）
    - cron: '*/5 * * * *'
  workflow_dispatch:  # 允许手动点按钮触发

permissions:
  contents: read
  gist: write  # 必须显式申请 gist 权限才能读写 state.json

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装依赖
        run: pip install -r requirements.txt

      # ---- state.json 持久化（存 GitHub Gist）----
      - name: 下载 state.json
        run: |
          curl -sL "https://api.github.com/gists/${{ secrets.GIST_ID }}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            | python3 -c "
import sys, json
d = json.load(sys.stdin)
content = d.get('files', {}).get('state.json', {}).get('content', '')
open('state.json', 'w').write(content or '{}')
"

      - name: 跑一轮轮询
        env:
          QQ_APPID: ${{ secrets.QQ_APPID }}
          QQ_SECRET: ${{ secrets.QQ_SECRET }}
          QQ_OFFICIAL_ENABLED: "true"
        run: python3 main.py --once --no-web

      - name: 上传 state.json
        if: always()
        run: |
          python3 -c "
import json, urllib.request, os
gist_id = os.environ['GIST_ID']
token = os.environ['GITHUB_TOKEN']
content = open('state.json').read()
body = json.dumps({'files': {'state.json': {'content': content}}}).encode()
req = urllib.request.Request(
    f'https://api.github.com/gists/{gist_id}',
    data=body, method='PATCH',
    headers={
        'Authorization': f'Bearer {token}',
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github+json',
    }
)
urllib.request.urlopen(req)
print('state.json 已保存到 Gist')
"
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
